server {
    listen 8000;
    server_name _;
    # Do not advertise the nginx version (VAPT F-02).
    server_tokens off;
    client_max_body_size 10M;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only run PHP files that really exist (blocks /file.png/x.php path-info tricks).
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Never send the PHP version to clients (VAPT F-02); also set by expose_php=Off.
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }

    # ── Security headers ─────────────────────────────────────────────────
    # Content-Security-Policy: allow scripts/styles/fonts/images from self
    # and the Reverb WebSocket host.  Update REVERB_HOST to match your domain.
    # The 'unsafe-inline' on style-src is required by Tailwind's inline styles
    # until a nonce-based approach is implemented.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss://$host ws://$host; frame-ancestors 'none';"
        always;

    # Prevent browsers from MIME-sniffing the content type
    add_header X-Content-Type-Options "nosniff" always;

    # Never send the site in a frame (redundant with CSP frame-ancestors but
    # kept for older browsers that don't understand CSP)
    add_header X-Frame-Options "DENY" always;

    # Force HTTPS in browsers that have visited before (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable referrer for cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Browser features this API never needs.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ── WebSocket proxy → Reverb container (BACKEND ACTION ITEM 9.9) ─────
    # Previously `location /app` forwarded EVERY path under /app to Reverb, so
    # bot probes such as /app/.env, /app/.git/config or /app/index.php reached
    # the WebSocket server and came back as HTTP 500.
    #
    # Reverb's WebSocket endpoint is exactly /app/<app-key> and only ever
    # receives a real WebSocket upgrade, so only that shape is proxied.
    # Everything else under /app is answered here with 404 and never reaches
    # Reverb.
    #
    # `if` is used ONLY with `return`, which is the one safe use of it in
    # nginx; the proxy directives sit outside any `if` block.
    location ^~ /app/ {
        if ($uri !~ "^/app/[A-Za-z0-9_-]{1,64}$") { return 404; }
        if ($http_upgrade !~* "^websocket$")      { return 404; }

        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Bare /app (no trailing slash) is never a valid Reverb URL.
    location = /app { return 404; }

    # Reverb's signed HTTP API (/apps/<id>/events, ...). Same upstream and
    # settings as before, kept on its own prefix so tightening /app/ above
    # cannot affect it. The backend normally calls Reverb directly over the
    # Docker network (REVERB_HOST=reverb), but if any environment points
    # REVERB_HOST at the public domain, those calls still arrive here.
    # Requests are authenticated by Reverb with the app secret signature.
    location ^~ /apps/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /broadcasting/ {
        proxy_pass http://backend:8000/broadcasting/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}