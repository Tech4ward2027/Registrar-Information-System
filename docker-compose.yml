services:
  # -------------------------------------------------------
  # Laravel Backend
  # -------------------------------------------------------
  backend:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ris_backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_BASE_URL: ${SSO_BASE_URL}
      SSO_SUPERADMIN_EMAIL: ${SSO_SUPERADMIN_EMAIL}
      SSO_SUPERADMIN_PASSWORD: ${SSO_SUPERADMIN_PASSWORD}
      SSO_API_KEY: ${SSO_API_KEY}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      # Web Push (background notifications) — see registrar-backend/config/webpush.php
      WEBPUSH_ENABLED: ${WEBPUSH_ENABLED:-false}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      OGOS_BASE_URL: ${OGOS_BASE_URL}
      OGOS_CLIENT_ID: ${OGOS_CLIENT_ID}
      OGOS_CLIENT_SECRET: ${OGOS_CLIENT_SECRET}
      APP_NAME: ${APP_NAME:-RIS}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      ALUMNI_API_URL: https://puptaps.ojt-ims-bsit.net/api
      ALUMNI_API_TOKEN: ${ALUMNI_API_TOKEN}
      OCMS_BASE_URL: ${OCMS_BASE_URL}
      OCMS_CLIENT_ID: ${OCMS_CLIENT_ID}
      OCMS_CLIENT_SECRET: ${OCMS_CLIENT_SECRET}
      CASHIER_API_KEY: ${CASHIER_API_KEY}
      CASHIER_API_URL: ${CASHIER_API_URL}
      CASHIER_SINGLE_USE: ${CASHIER_SINGLE_USE}
      ALUMNI_MOCK: ${ALUMNI_MOCK}
      TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
      # Feature flags are NOT inherited from the host .env: this file passes
      # variables through explicitly, so every flag a service reads must be
      # listed here. Fail-closed default (see config/features.php): a missing
      # or empty value keeps the feature OFF.
      # free_request_page gates the admin Free Document/Certificate Request page.
      FEATURE_FREE_REQUEST_PAGE: ${FEATURE_FREE_REQUEST_PAGE:-false}
      # system_health gates the System Health / Failed Verifications API.
      FEATURE_SYSTEM_HEALTH: ${FEATURE_SYSTEM_HEALTH:-false}
      # tickets gates every Support Ticketing route (student, staff, public).
      FEATURE_TICKETS: ${FEATURE_TICKETS:-false}
      # Public ticket CAPTCHA (Cloudflare Turnstile by default). With CAPTCHA
      # enabled (the default) and no secret, public submissions are refused, by
      # design. The ticketing tuning values (TICKETS_RL_*, TICKETS_PUBLIC_*) are
      # read from the container environment too; add any you change here.
      TICKETS_PUBLIC_CAPTCHA_ENABLED: ${TICKETS_PUBLIC_CAPTCHA_ENABLED:-true}
      TICKETS_CAPTCHA_SITE_KEY: ${TICKETS_CAPTCHA_SITE_KEY:-}
      TICKETS_CAPTCHA_SECRET: ${TICKETS_CAPTCHA_SECRET:-}
    ports:
      - "8000:8000"
    networks:
      - ris_network

  # -------------------------------------------------------
  # Laravel Reverb (WebSocket Server)
  # -------------------------------------------------------
  reverb:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ris_reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      REVERB_SCALING_ENABLED: ${REVERB_SCALING_ENABLED:-false}
      REVERB_SCALING_CHANNEL: ${REVERB_SCALING_CHANNEL:-reverb}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      OGOS_BASE_URL: ${OGOS_BASE_URL}
      OGOS_CLIENT_ID: ${OGOS_CLIENT_ID}
      OGOS_CLIENT_SECRET: ${OGOS_CLIENT_SECRET}
      APP_NAME: ${APP_NAME:-RIS}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CASHIER_API_KEY: ${CASHIER_API_KEY}
      CASHIER_API_URL: ${CASHIER_API_URL}
      CASHIER_SINGLE_USE: ${CASHIER_SINGLE_USE}
      ALUMNI_MOCK: ${ALUMNI_MOCK}
      OCMS_BASE_URL: ${OCMS_BASE_URL}
      OCMS_CLIENT_ID: ${OCMS_CLIENT_ID}
      OCMS_CLIENT_SECRET: ${OCMS_CLIENT_SECRET}
      SSO_API_KEY: ${SSO_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ris_network

  # -------------------------------------------------------
  # Queue Worker
  # -------------------------------------------------------
  worker:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ris_worker
    restart: unless-stopped
    command: >
      php artisan queue:work
        --queue=default
        --sleep=3
        --tries=3
        --timeout=300
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      # Web Push: this service calls NotificationService::send(), which decides whether to queue a push.
      WEBPUSH_ENABLED: ${WEBPUSH_ENABLED:-false}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      OGOS_BASE_URL: ${OGOS_BASE_URL}
      OGOS_CLIENT_ID: ${OGOS_CLIENT_ID}
      OGOS_CLIENT_SECRET: ${OGOS_CLIENT_SECRET}
      APP_NAME: ${APP_NAME:-RIS}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CASHIER_API_KEY: ${CASHIER_API_KEY}
      CASHIER_API_URL: ${CASHIER_API_URL}
      CASHIER_SINGLE_USE: ${CASHIER_SINGLE_USE}
      ALUMNI_MOCK: ${ALUMNI_MOCK}
      OCMS_BASE_URL: ${OCMS_BASE_URL}
      OCMS_CLIENT_ID: ${OCMS_CLIENT_ID}
      OCMS_CLIENT_SECRET: ${OCMS_CLIENT_SECRET}
      SSO_API_KEY: ${SSO_API_KEY}
    depends_on:
      backend:
        condition: service_started
    networks:
      - ris_network

  # -------------------------------------------------------
  # Redis — shared cache + session store for horizontal scaling
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ris_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - ris_network

  # -------------------------------------------------------
  # Broadcast Worker — dedicated queue for WebSocket pushes
  # -------------------------------------------------------
  # Keeping broadcasts on a separate queue prevents slow DB jobs from
  # delaying real-time notification delivery.  The worker is intentionally
  # lightweight: short timeout, fast sleep, restarts immediately on exit.
  # -------------------------------------------------------
  broadcast-worker:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ris_broadcast_worker
    restart: unless-stopped
    command: >
      php artisan queue:work database
        --queue=broadcasts
        --sleep=1
        --tries=3
        --timeout=30
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      # Web Push (background notifications) — see registrar-backend/config/webpush.php
      WEBPUSH_ENABLED: ${WEBPUSH_ENABLED:-false}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      OGOS_BASE_URL: ${OGOS_BASE_URL}
      OGOS_CLIENT_ID: ${OGOS_CLIENT_ID}
      OGOS_CLIENT_SECRET: ${OGOS_CLIENT_SECRET}
      APP_NAME: ${APP_NAME:-RIS}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CASHIER_API_KEY: ${CASHIER_API_KEY}
      CASHIER_API_URL: ${CASHIER_API_URL}
      CASHIER_SINGLE_USE: ${CASHIER_SINGLE_USE}
      ALUMNI_MOCK: ${ALUMNI_MOCK}
      OCMS_BASE_URL: ${OCMS_BASE_URL}
      OCMS_CLIENT_ID: ${OCMS_CLIENT_ID}
      OCMS_CLIENT_SECRET: ${OCMS_CLIENT_SECRET}
      SSO_API_KEY: ${SSO_API_KEY}
    depends_on:
      backend:
        condition: service_started
    networks:
      - ris_network

  # -------------------------------------------------------
  # Scheduler — runs php artisan schedule:run every minute.
  # Handles: notifications:shred-expired-requests (08:00)
  #          notifications:send-unclaimed-reminders (08:05)
  # -------------------------------------------------------
  scheduler:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ris_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction >> /var/log/scheduler.log 2>&1; sleep 60; done"
    environment:
      # health:rollup / health:detect are no-ops unless this flag is on, so the
      # scheduler needs the same value as the backend. Fail-closed default.
      FEATURE_SYSTEM_HEALTH: ${FEATURE_SYSTEM_HEALTH:-false}
      # Ticket SLA / auto-close / retention commands are no-ops unless this
      # flag is on, so the scheduler needs the same value as the backend.
      FEATURE_TICKETS: ${FEATURE_TICKETS:-false}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      # Web Push: this service calls NotificationService::send(), which decides whether to queue a push.
      WEBPUSH_ENABLED: ${WEBPUSH_ENABLED:-false}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      OGOS_BASE_URL: ${OGOS_BASE_URL}
      OGOS_CLIENT_ID: ${OGOS_CLIENT_ID}
      OGOS_CLIENT_SECRET: ${OGOS_CLIENT_SECRET}
      APP_NAME: ${APP_NAME:-RIS}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CASHIER_API_KEY: ${CASHIER_API_KEY}
      CASHIER_API_URL: ${CASHIER_API_URL}
      CASHIER_SINGLE_USE: ${CASHIER_SINGLE_USE}
      ALUMNI_MOCK: ${ALUMNI_MOCK}
      OCMS_BASE_URL: ${OCMS_BASE_URL}
      OCMS_CLIENT_ID: ${OCMS_CLIENT_ID}
      OCMS_CLIENT_SECRET: ${OCMS_CLIENT_SECRET}
      SSO_API_KEY: ${SSO_API_KEY}
    depends_on:
      backend:
        condition: service_started
    networks:
      - ris_network

volumes:
  ris_db_data:

networks:
  ris_network:
    driver: bridge