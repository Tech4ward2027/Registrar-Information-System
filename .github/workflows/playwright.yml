name: Playwright Tests
on:
  push:
    branches: [develop, main]
    paths:
      - 'registrar-frontend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'registrar-frontend/**'

# Cancel superseded runs of the same branch/PR so they don't pile up.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and system libraries are preinstalled in this image, so the job
    # never runs apt-get (which was hanging on the Azure Ubuntu mirror).
    # The tag MUST match the locked @playwright/test version (1.62.0).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      HOME: /root
    defaults:
      run:
        working-directory: registrar-frontend

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: registrar-frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: registrar-frontend/playwright-report/
        retention-days: 30