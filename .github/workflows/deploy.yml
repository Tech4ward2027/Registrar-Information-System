name: RIS Production Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URI }}
  AWS_REGION: ap-southeast-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Run the full test suite before touching production.
  # Deploy only proceeds if this passes.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: PHP Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registrar-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none

      - name: Create .env
        run: |
          echo "APP_NAME=RIS" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "BROADCAST_CONNECTION=log" >> .env
          echo "BROADCAST_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "REVERB_APP_ID=123456" >> .env
          echo "REVERB_APP_KEY=testkey" >> .env
          echo "REVERB_APP_SECRET=testsecret" >> .env
          echo "REVERB_HOST=localhost" >> .env
          echo "REVERB_PORT=8080" >> .env
          echo "REVERB_SCHEME=http" >> .env
          echo "ALUMNI_MOCK=true" >> .env
          echo "CASHIER_API_KEY=" >> .env
          echo "SSO_BASE_URL=http://localhost" >> .env
          echo "SSO_CLIENT_ID=test-client" >> .env
          echo "SSO_CLIENT_SECRET=test-secret" >> .env
          echo "ANTHROPIC_API_KEY=" >> .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build the backend Docker image and push it to ECR.
  # This replaces building directly on the EC2 box. Only runs if tests pass.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: registrar-backend
        run: |
          docker build --pull \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} \
            .
          docker push ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy backend to EC2.
  # SSHes in, pulls the latest compose/config files, pulls the pre-built image
  # from ECR (no building on the box), restarts containers, runs migrations.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (EC2)
    runs-on: ubuntu-latest
    needs: [test, build-and-push]

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ris-ci-deploy's credentials, explicitly. Without this, the
          # aws CLI on the EC2 host falls back to whatever is already
          # configured there by default — which turned out to be
          # ris-s3-user, an app-runtime credential that should never
          # have ECR access. Exporting these in-script overrides any
          # pre-existing ~/.aws/credentials on the box.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,ECR_REPOSITORY_URI,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -e
            cd /home/ubuntu/Registrar-Information-System

            echo "── Pulling latest config/compose files ──────────"
            git pull origin main

            echo "── Logging in to ECR (using ris-ci-deploy) ──────"
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION=ap-southeast-1
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

            export ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY_URI }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            echo "── Pulling image from ECR ───────────────────────"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "── Running migrations ───────────────────────────"
            # Migrate BEFORE (re)starting the long-running containers, as
            # a disposable one-off container. This closes a gap the
            # previous ordering left open: `docker compose up -d` returns
            # as soon as containers are *launched*, not once they're
            # actually ready — there's no healthcheck on the backend
            # service — so running migrate *after* up -d meant new
            # application code could accept traffic for a brief window
            # before its own schema migration had finished. Migrating
            # first guarantees the schema is fully up to date before
            # anything new is serving requests.
            #
            # This is still the ONLY place migrations run — start.sh no
            # longer runs `migrate` on container boot (see start.sh for
            # the full race-condition history). --isolated remains as
            # defense-in-depth: an atomic lock via the redis cache store,
            # in case of any future concurrent migrate invocation.
            #
            # --no-deps assumes redis is already running from the prior
            # deploy — true in steady state, since it uses `restart:
            # always` and isn't recreated unless its own image/config
            # changes. On a from-scratch environment stand-up (no
            # containers running at all yet), start it manually first:
            # `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d redis`.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              run --rm --no-deps backend php artisan migrate --force --isolated

            echo "── Starting containers ──────────────────────────"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "── Publishing Telescope assets ──────────────────"
            docker exec ris_backend php artisan vendor:publish --tag=telescope-assets --force

            echo "── Caching config and routes ────────────────────"
            docker exec ris_backend php artisan config:cache
            docker exec ris_backend php artisan route:cache

            echo "── Re-asserting storage/cache ownership ─────────"
            # The commands above run via `docker exec`, which defaults to
            # root (no USER directive drops privileges in the image). If any
            # of them touch storage/logs/laravel.log, they recreate it as
            # root-owned, and every subsequent www-data (php-fpm) write to
            # it then fails with "Permission denied" until someone chowns it
            # again. start.sh already does this once at container boot, but
            # that's *before* these exec'd commands run, so it doesn't cover
            # them. Re-run it here, right after, so nothing is left behind.
            docker exec -u root ris_backend chown -R www-data:www-data \
              /var/www/html/storage /var/www/html/bootstrap/cache

            echo "── Verifying containers are up ──────────────────"
            docker compose ps

            echo "── Pruning old images (keep disk clean) ─────────"
            docker image prune -a -f

            echo "── Done ─────────────────────────────────────────"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build and deploy frontend to S3 + invalidate CloudFront cache.
  # Runs in parallel with the backend jobs since it's independent.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: registrar-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: registrar-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SSO_LOGIN_URL: ${{ secrets.VITE_SSO_LOGIN_URL }}
          VITE_SSO_CLIENT_ID: ${{ secrets.VITE_SSO_CLIENT_ID }}
          VITE_SSO_BASE_URL: ${{ secrets.VITE_SSO_BASE_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync build to S3
        run: |
          # Step 1 — upload new hashed assets, no --delete yet. Old assets
          # from the previous deploy are left in place for now; this step
          # can never leave the bucket in a broken state since nothing is
          # removed here, only added.
          aws s3 sync ./dist s3://ris-frontend-app/ \
            --region ap-southeast-1 \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # Step 2 — prune orphaned assets from the previous deploy.
          # Deliberately unfiltered (no --exclude) and run BEFORE the
          # index.html upload below, for two reasons:
          #   1. Combining --exclude with --delete in a single `aws s3
          #      sync` call has inconsistent, version-dependent behaviour
          #      in the AWS CLI itself (see aws/aws-cli#4923 and #1268) —
          #      in the worst case it deletes the excluded destination
          #      file instead of protecting it. Since index.html still
          #      exists in ./dist (nothing excludes it from this call),
          #      that whole failure class doesn't apply here: sync only
          #      ever deletes destination files that are absent from the
          #      source entirely, and index.html is never absent.
          #   2. Running this BEFORE the index.html upload (not after)
          #      means the deploy's actual "make index.html live" step is
          #      the last, authoritative write — nothing later can
          #      silently revert its cache-control. If this cleanup sync's
          #      timestamp comparison happens to decide index.html itself
          #      needs re-uploading, it would (harmlessly) apply the
          #      long-cache header from this command — but step 3 below
          #      unconditionally overwrites it with the correct one right
          #      after, so the final state is deterministic either way.
          aws s3 sync ./dist s3://ris-frontend-app/ \
            --delete \
            --region ap-southeast-1 \
            --cache-control "public, max-age=31536000, immutable"

          # Step 3 — publish index.html last, always. This is what makes
          # the new deploy live, and its cache-control is guaranteed
          # correct regardless of anything step 2 touched.
          aws s3 cp ./dist/index.html s3://ris-frontend-app/index.html \
            --region ap-southeast-1 \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'