name: RIS Staging Deploy

on:
  push:
    branches: [develop]

env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URI }}
  AWS_REGION: ap-southeast-1

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrar-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - name: Create .env
        run: |
          echo "APP_NAME=RIS" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "BROADCAST_CONNECTION=log" >> .env
          echo "BROADCAST_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "REVERB_APP_ID=123456" >> .env
          echo "REVERB_APP_KEY=testkey" >> .env
          echo "REVERB_APP_SECRET=testsecret" >> .env
          echo "REVERB_HOST=localhost" >> .env
          echo "REVERB_PORT=8080" >> .env
          echo "REVERB_SCHEME=http" >> .env
          echo "ALUMNI_MOCK=true" >> .env
          echo "CASHIER_API_KEY=" >> .env
          echo "SSO_BASE_URL=http://localhost" >> .env
          echo "SSO_CLIENT_ID=test-client" >> .env
          echo "SSO_CLIENT_SECRET=test-secret" >> .env
          echo "ANTHROPIC_API_KEY=" >> .env
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
      - run: php artisan key:generate
      - run: php artisan test

  build-and-push:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: vars
        run: echo "tag=staging-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        working-directory: registrar-backend
        run: |
          docker build --pull -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }} .
          docker push ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}

  deploy-backend:
    name: Deploy Backend (EC2)
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    steps:
      - name: Deploy to Staging EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_STAGING }}
          envs: IMAGE_TAG,ECR_REPOSITORY_URI,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -e
            cd /home/ubuntu/Registrar-Information-System

            echo "── Pulling latest compose/config files ──────────"
            git pull origin develop

            echo "── Logging in to ECR ────────────────────────────"
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION=ap-southeast-1
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

            export ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY_URI }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            echo "── Pulling image from ECR ───────────────────────"
            docker compose -f docker-compose.staging.yml pull

            echo "── Running migrations ────────────────────────────"
            # Migrate BEFORE (re)starting the long-running containers —
            # see deploy.yml for the full reasoning (no healthcheck on
            # the backend service means `up -d` doesn't guarantee the
            # app is actually ready, so migrating first avoids a window
            # where new code could serve traffic before its own schema
            # migration finishes).
            #
            # --no-deps assumes mysql/redis are already running from the
            # prior deploy (restart: unless-stopped). On a from-scratch
            # stand-up, start them first:
            # `docker compose -f docker-compose.staging.yml up -d mysql redis`.
            docker compose -f docker-compose.staging.yml \
              run --rm --no-deps backend php artisan migrate --force --isolated

            echo "── Starting containers ──────────────────────────"
            docker compose -f docker-compose.staging.yml up -d

            echo "── Caching config and routes ─────────────────────"
            docker exec ris_staging_backend php artisan config:cache
            docker exec ris_staging_backend php artisan route:cache

            echo "── Re-asserting storage/cache ownership ──────────"
            docker exec -u root ris_staging_backend chown -R www-data:www-data \
              /var/www/html/storage /var/www/html/bootstrap/cache

            echo "── Verifying containers are up ───────────────────"
            docker compose -f docker-compose.staging.yml ps

            echo "── Pruning old images (keep disk clean) ──────────"
            docker image prune -a -f

            echo "── Done ───────────────────────────────────────────"

  deploy-frontend:
    name: Deploy Frontend (EC2 static)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: registrar-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: registrar-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_SSO_LOGIN_URL: ${{ secrets.VITE_SSO_LOGIN_URL_STAGING }}
          VITE_SSO_CLIENT_ID: ${{ secrets.VITE_SSO_CLIENT_ID_STAGING }}
          VITE_SSO_BASE_URL: ${{ secrets.VITE_SSO_BASE_URL_STAGING }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY_STAGING }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST_STAGING }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT_STAGING }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME_STAGING }}
        run: npm run build -- --mode staging
      - name: Sync build to staging EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: registrar-frontend/dist/
          remote_path: /var/www/staging-dist/
          remote_host: ${{ secrets.EC2_HOST_STAGING }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY_STAGING }}