name: RIS Staging Deploy (VPS)

# Replaces the old AWS/ECR staging pipeline.
# develop -> test -> build image -> push to GHCR -> deploy backend to the VPS -> deploy frontend.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false   # never cut a deploy off half way

permissions:
  contents: read

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrar-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - name: Create .env
        run: |
          echo "APP_NAME=RIS" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ29ubHkxMjM0NTY3OA==" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "BROADCAST_CONNECTION=log" >> .env
          echo "BROADCAST_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "REVERB_APP_ID=123456" >> .env
          echo "REVERB_APP_KEY=testkey" >> .env
          echo "REVERB_APP_SECRET=testsecret" >> .env
          echo "REVERB_HOST=localhost" >> .env
          echo "REVERB_PORT=8080" >> .env
          echo "REVERB_SCHEME=http" >> .env
          echo "ALUMNI_MOCK=true" >> .env
          echo "CASHIER_API_KEY=" >> .env
          echo "SSO_BASE_URL=http://localhost" >> .env
          echo "SSO_CLIENT_ID=test-client" >> .env
          echo "SSO_CLIENT_SECRET=test-secret" >> .env
          echo "ANTHROPIC_API_KEY=" >> .env
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
      - run: php artisan key:generate
      - run: php artisan test

  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name and tag
        id: vars
        run: |
          # GHCR names must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ris-backend" >> "$GITHUB_OUTPUT"
          echo "tag=staging-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64)
        working-directory: registrar-backend
        run: |
          docker build --pull --platform linux/amd64 -t "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" .
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"

  deploy-backend:
    name: Deploy backend to the VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ris_deploy
          chmod 600 ~/.ssh/ris_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Variables travel on stdin, not on a command line, so the token never shows in `ps`.
          set -o pipefail
          {
            printf 'export IMAGE=%q TAG=%q GHCR_USER=%q GHCR_TOKEN=%q\n' \
              "$IMAGE" "$TAG" "$GHCR_USER" "$GHCR_TOKEN"
            cat scripts/vps-deploy-staging.sh
          } | ssh -i ~/.ssh/ris_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$VPS_USER@$VPS_HOST" 'bash -s' | tee deploy.log
          # A green exit code is not enough: the script must reach its last line.
          # (An early silent exit once let a half-finished deploy look successful.)
          grep -q "^deploy ok: ${IMAGE}:${TAG}$" deploy.log || {
            echo "::error::The VPS script did not finish (no 'deploy ok' line)."; exit 1; }

  deploy-frontend:
    name: Deploy frontend to the VPS
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: staging
    defaults:
      run:
        working-directory: registrar-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: registrar-frontend/package-lock.json
      - run: npm ci
      - name: Build frontend (staging mode)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_SSO_LOGIN_URL: ${{ secrets.VITE_SSO_LOGIN_URL_STAGING }}
          VITE_SSO_CLIENT_ID: ${{ secrets.VITE_SSO_CLIENT_ID_STAGING }}
          VITE_SSO_BASE_URL: ${{ secrets.VITE_SSO_BASE_URL_STAGING }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY_STAGING }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST_STAGING }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT_STAGING }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME_STAGING }}
        run: npm run build -- --mode staging
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ris_deploy
          chmod 600 ~/.ssh/ris_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync build to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/ris_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:/srv/ris/staging/frontend/dist/"
