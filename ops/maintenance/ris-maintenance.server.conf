# Install as: /etc/nginx/snippets/ris-maintenance.conf
# Include from the TOP of each public `server { ... }` block, before any
# `location`, on the production host:
#
#     include snippets/ris-maintenance.conf;
#
# Maintenance mode is a flag file, not a config change: creating
# /etc/ris-maintenance/ENABLED switches it on instantly and removing it
# switches it off, with no nginx reload (see ris-maintenance.sh).
#
# Only `set` and `return` are used inside `if` (the safe uses of `if` in nginx).
# Because this runs in the server-level rewrite phase, it answers BEFORE any
# location is chosen: the API, the WebSocket endpoint (/app/, /apps/) and
# /broadcasting/ are all covered, and nothing reaches the containers.
set $ris_maint 0;
if (-f /etc/ris-maintenance/ENABLED) { set $ris_maint 1; }
if ($ris_maint_bypass)               { set $ris_maint 0; }
if ($ris_maint)                      { return 503; }

error_page 503 @ris_maintenance;

location @ris_maintenance {
    root /var/www/ris-maintenance;
    rewrite ^ /maintenance.html break;

    # The splash page is public. A server-level auth_basic (staging has one) is
    # inherited by this location and would turn the 503 into a login prompt.
    auth_basic off;

    # 503 + Retry-After tells browsers, crawlers and monitors this is
    # temporary. no-store keeps the splash out of caches so reopening is instant.
    add_header Retry-After "900" always;
    add_header Cache-Control "no-store" always;

    # add_header in a location replaces inherited headers, so repeat the
    # security headers here. The page has no scripts, so the CSP is minimal.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}