# Install as: /etc/nginx/conf.d/ris-maintenance.conf   (http context)
#
# Builds the bypass flag used by the server snippet. Anyone whose address is
# listed in /etc/ris-maintenance/allow.conf can still reach the site while
# maintenance mode is on (so the recovery team can test the restored system
# before reopening). Format of allow.conf, one entry per line:
#     203.0.113.10 1;
#     198.51.100.0/24 1;
#
# $remote_addr is the TCP peer. On a hostname that sits BEHIND CloudFront
# (pupt-ris) that peer is a CloudFront edge address, never the user: do NOT
# allowlist CloudFront ranges. The allowlist is meaningful only for hosts that
# reach nginx directly (pupt-ris-api, and 127.0.0.1 for on-box checks).
geo $ris_maint_bypass {
    default 0;
    include /etc/ris-maintenance/allow.conf;
}
